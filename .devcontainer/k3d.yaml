apiVersion: k3d.io/v1alpha2
kind: Simple
# pinned k3s version - matches kubectl v1.28.3 pinned in install-tools.sh
# (k3d v4.4.8 default image is k3s v1.21.3 which bundles Traefik 2.4.8 that
#  does NOT support spec.ingressClassName field -> ingress returns 404)
image: rancher/k3s:v1.28.3-k3s1
servers: 1
agents: 1
network: k3d
kubeAPI:
  hostIP: "0.0.0.0"
  hostPort: "6443"
volumes:
  - volume: /prometheus:/prometheus
    nodeFilters:
      - server[0]
  - volume: /grafana:/grafana
    nodeFilters:
      - server[0]
ports:
  # Traefik Ingress gateway - all apps are routed via Host rules
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  # PostgreSQL (via LoadBalancer service)
  - port: 5432:5432
    nodeFilters:
      - loadbalancer
  # Redis (via LoadBalancer service)
  - port: 6379:6379
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "60s"
  k3s:
    extraServerArgs:
      - --tls-san=127.0.0.1
    extraAgentArgs: []
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
