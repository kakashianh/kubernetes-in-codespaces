# Traefik Ingress - routes all apps via host-based rules on port 8080
#
# usage from the dev container:
#   curl -H 'Host: imdb.localhost' localhost:8080/version
#   curl -H 'Host: heartbeat.localhost' localhost:8080/heartbeat/17
#
# in browser (localhost forwarded) the *.localhost hosts resolve to 127.0.0.1

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imdb
  namespace: imdb
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: imdb.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imdb
                port:
                  number: 8080

---

